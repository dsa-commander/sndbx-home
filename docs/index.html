<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sndbx.ing</title>
<style>
  :root {
    --bg: #0f1115; --card: #171a21; --text: #e8e9ec; --muted: #9aa1ac;
    --accent: #7cc4ff; --border: #262b35;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    line-height: 1.45;
    display: flex; align-items: center; min-height: 100vh;
  }
  main { max-width: 560px; margin: 0 auto; padding: 40px 20px; width: 100%; }
  header { margin-bottom: 28px; }
  header h1 { font-size: 1.6rem; margin: 0 0 6px; }
  header p { color: var(--muted); margin: 0; font-size: 0.95rem; }
  .projects { display: flex; flex-direction: column; gap: 12px; }
  .project {
    display: flex; gap: 14px; align-items: center;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px 18px;
    text-decoration: none; color: inherit;
    transition: border-color 0.15s ease;
  }
  .project:hover { border-color: var(--accent); }
  .project-icon { font-size: 1.6rem; line-height: 1; flex: 0 0 auto; }
  .project-body { min-width: 0; }
  .project-title { font-weight: 600; font-size: 1.02rem; }
  .project-desc { color: var(--muted); font-size: 0.85rem; margin-top: 2px; }
  .project-arrow { margin-left: auto; color: var(--muted); flex: 0 0 auto; }
</style>
</head>
<body>
<main>
  <header>
    <h1>sndbx.ing</h1>
    <p>A small collection of projects.</p>
  </header>
  <div class="projects">
    <a class="project" href="https://ai-news.sndbx.ing" target="_blank" rel="noopener">
      <span class="project-icon">🧠</span>
      <span class="project-body">
        <span class="project-title">AI News</span>
        <span class="project-desc">Self-updating AI news, aggregated from 20+ sources every hour.</span>
      </span>
      <span class="project-arrow">→</span>
    </a>
  </div>
</main>
</body>
</html>
